workflows:
  helium-android-debug:
    name: Helium Mail Android Debug APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      node: 22
      java: 21
      vars:
        # Hosted Helium Mail Express server URL for live IMAP/SMTP & Gmail proxy sync
        VITE_API_BASE_URL: "https://ais-pre-bypfs6wswo3z2s72ynsqyi-68265783693.europe-west2.run.app"
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - node_modules
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Run pure logic unit tests
        script: |
          npx --yes tsx --test src/lib/mailLogic.test.ts src/lib/localMailboxEngine.test.ts
      - name: Build Helium Mail web bundle
        script: |
          npm run build
      - name: Sync web bundle into Capacitor Android
        script: |
          npx cap sync android
      - name: Configure Android SDK local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Build Android Debug APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

  helium-android-release:
    name: Helium Mail Android Release (AAB & APK)
    max_build_duration: 90
    instance_type: linux_x2
    environment:
      node: 22
      java: 21
      groups:
        # Create in Codemagic UI with:
        # FCI_KEYSTORE (base64 .keystore/.jks), FCI_KEYSTORE_PASSWORD, FCI_KEY_ALIAS, FCI_KEY_PASSWORD
        - keystore_credentials
        # Optional: create in Codemagic UI with GCLOUD_SERVICE_ACCOUNT_CREDENTIALS JSON
        - google_play
      vars:
        VITE_API_BASE_URL: "https://ais-pre-bypfs6wswo3z2s72ynsqyi-68265783693.europe-west2.run.app"
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - node_modules
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Run pure logic unit tests
        script: |
          npx --yes tsx --test src/lib/mailLogic.test.ts src/lib/localMailboxEngine.test.ts
      - name: Build Helium Mail web bundle
        script: |
          npm run build
      - name: Sync web bundle into Capacitor Android
        script: |
          npx cap sync android
      - name: Configure Android SDK and release keystore
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
          echo "$FCI_KEYSTORE" | base64 --decode > /tmp/helium-release.keystore
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$FCI_KEYSTORE_PASSWORD
          keyPassword=$FCI_KEY_PASSWORD
          keyAlias=$FCI_KEY_ALIAS
          storeFile=/tmp/helium-release.keystore
          EOF
      - name: Build signed Android Release AAB & APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  helium-ios-release:
    name: Helium Mail iOS Release (IPA / TestFlight)
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.heliummail.client
      vars:
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
        VITE_API_BASE_URL: "https://ais-pre-bypfs6wswo3z2s72ynsqyi-68265783693.europe-west2.run.app"
    cache:
      cache_paths:
        - node_modules
        - $HOME/Library/Developer/Xcode/DerivedData
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Run pure logic unit tests
        script: |
          npx --yes tsx --test src/lib/mailLogic.test.ts src/lib/localMailboxEngine.test.ts
      - name: Build Helium Mail web bundle
        script: |
          npm run build
      - name: Sync web bundle into Capacitor iOS (SwiftPM)
        script: |
          npx cap sync ios
      - name: Apply Xcode code signing profiles
        script: |
          xcode-project use-profiles
      - name: Increment iOS build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build iOS IPA
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
